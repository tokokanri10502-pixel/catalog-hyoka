name: Keep Supabase awake

# Supabase の無料プランは1週間アクセスがないと一時停止するので、毎日1回だけ読みに行く
on:
  schedule:
    - cron: '0 0 * * *' # 毎日 9:00（日本時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          # ブラウザ用の公開値（anon/publishable）。deploy.yml と同じ
          URL: https://cqhvqydljtyzxpjddgld.supabase.co
          KEY: sb_publishable_3TgRPq0LYWvZ8BiWGMxG7A_Nn9Sk3zi
        run: curl -fsS -m 30 -H "apikey: $KEY" "$URL/rest/v1/settings?select=title"
